name: Bootstrap pinned json-render Jev core
on:
  push:
    paths:
      - .github/workflows/bootstrap-json-render.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.1.3'
      - name: Build pinned upstream core package
        env:
          JSON_RENDER_SHA: 3ad381881194e7011ad3ccd6d668033495a06c29
        run: |
          set -euo pipefail
          git init /tmp/json-render
          git -C /tmp/json-render remote add origin https://github.com/vercel-labs/json-render.git
          git -C /tmp/json-render fetch --depth=1 origin "$JSON_RENDER_SHA"
          git -C /tmp/json-render checkout --detach FETCH_HEAD
          test "$(git -C /tmp/json-render rev-parse HEAD)" = "$JSON_RENDER_SHA"
          cd /tmp/json-render
          pnpm install --frozen-lockfile
          pnpm --filter @json-render/core build
          mkdir -p "$GITHUB_WORKSPACE/out"
          pnpm --filter @json-render/core pack --pack-destination "$GITHUB_WORKSPACE/out"
          cd "$GITHUB_WORKSPACE/out"
          sha256sum *.tgz > SHA256SUMS
      - name: Vendor verified archive on develop
        env:
          JSON_RENDER_SHA: 3ad381881194e7011ad3ccd6d668033495a06c29
          JSON_RENDER_SHA256: 0b002467614c0ade41e18ef6b15c116e9cf41fbe44cd49c6d93a49fe5adf73e6
        run: |
          set -euo pipefail
          test "$(cut -d' ' -f1 out/SHA256SUMS)" = "$JSON_RENDER_SHA256"
          mkdir -p vendor
          cp out/json-render-core-0.21.0.tgz vendor/json-render-core-3ad38188.tgz
          cat > vendor/json-render-core-3ad38188.json <<JSON
          {
            "package": "@json-render/core",
            "packageVersion": "0.21.0",
            "upstreamRepository": "https://github.com/vercel-labs/json-render",
            "upstreamCommit": "$JSON_RENDER_SHA",
            "sha256": "$JSON_RENDER_SHA256",
            "builtBy": "pnpm --filter @json-render/core build && pnpm --filter @json-render/core pack",
            "reason": "Official experimental Jev APIs are not yet published to npm; see https://json-render.dev/docs/jev"
          }
          JSON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/json-render-core-3ad38188.tgz vendor/json-render-core-3ad38188.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: vendor pinned json-render Jev preview core'
            git push origin HEAD:develop
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: json-render-jev-core-3ad38188
          path: out/
          retention-days: 7
