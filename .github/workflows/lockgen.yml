name: Refresh lockfile for pinned json-render preview
on:
  push:
    paths:
      - .github/workflows/lockgen.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: official-json-render-jev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh lockfile for pinned json-render preview'
            git push origin HEAD:official-json-render-jev
          fi
