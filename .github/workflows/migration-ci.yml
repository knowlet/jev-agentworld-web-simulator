name: Migration validation
on:
  push:
    paths:
      - .github/workflows/migration-ci.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: official-json-render-jev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run verify:json-render
      - run: npm run typecheck
      - run: npm run build
      - run: |
          mkdir -p reports
          set -o pipefail
          npm test 2>&1 | tee reports/unit.tap
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-validation-${{ github.run_id }}
          path: |
            reports/
            test-results/
            playwright-report/
            vendor/json-render-core-3ad38188.json
          if-no-files-found: warn
          retention-days: 7
